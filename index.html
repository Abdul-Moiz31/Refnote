<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The renderer only ever loads local assets and talks to the main process
      through the preload bridge, so everything is locked to 'self'. The
      websocket/http localhost allowances are what Vite's dev server needs for
      hot reload; 'unsafe-inline' covers the styles Vite injects.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' ws://localhost:* http://localhost:*;
               object-src 'none';
               base-uri 'self';
               form-action 'none'"
    />
    <title>Refnote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/renderer.tsx"></script>
  </body>
</html>
